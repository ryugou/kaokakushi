name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SwiftLint はランナーへ brew で導入する。
      # （「macos-15 イメージに標準搭載」という情報に基づき一度削除したが、
      # 2026-08 時点の実ランナーで command not found となり CI が失敗したため復活。
      # プリインストールを仮定しない。）
      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (strict)
        run: swiftlint lint --strict

  import-scan:
    name: import 許可リスト走査 (Domain / Application)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: scripts/check-imports-test.sh（回帰テスト）
        run: bash scripts/check-imports-test.sh

      - name: scripts/check-imports.sh
        run: bash scripts/check-imports.sh

  package-tests:
    name: swift test (全パッケージ)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: ./.github/actions/select-xcode

      # Issue #6（Persistence への GRDB.swift 導入）で初めて外部SwiftPM依存が入った。
      # --scratch-path 配下（checkouts/repositories/artifacts 等の解決済みパッケージ）
      # に加え、SwiftPM が既定で使う OS 共有のリポジトリクローンキャッシュ
      # （macOS: ~/Library/Caches/org.swift.swiftpm。--cache-path 未指定時の既定で
      # scratch-path の外に置かれる）もキャッシュ対象にする。実際にどちらへ
      # クローンキャッシュが作られるかはこのコンテナでは実行検証できないため、
      # 両方を対象にして取りこぼしを避ける（存在しないパスは actions/cache が
      # 無視するだけで失敗しない）。
      #
      # キャッシュキーは packages/**/Package.resolved のハッシュを含める。
      # Package.resolved はこのコンテナでは生成できず未コミットのため、初回実行時は
      # restore-keys（runner.os のみのプレフィックス）にフォールバックし、
      # swift test 実行時に GRDB 解決が走って Package.resolved が生成される。
      # 以後のコミットで Package.resolved がリポジトリへ入れば、そのハッシュを含む
      # 完全一致キーでキャッシュが効くようになる（CI 側で生成物をコミットする責務は
      # 持たない）。
      - name: Cache SwiftPM (package-tests)
        uses: actions/cache@v4
        with:
          path: |
            .build/ci-shared
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-package-tests-${{ runner.os }}-${{ hashFiles('packages/**/Package.resolved') }}
          restore-keys: |
            swiftpm-package-tests-${{ runner.os }}-

      # --scratch-path を全パッケージで共有し、依存先（Domain）のビルド成果物を
      # 使い回す（共有しないと Domain が依存元の数だけ再コンパイルされる）。
      - name: swift test (all packages)
        run: |
          set -euo pipefail
          for p in Domain Rendering MediaKit Persistence Application Billing Ads Analytics; do
            echo "::group::swift test $p"
            swift test --package-path "packages/$p" --scratch-path "$PWD/.build/ci-shared"
            echo "::endgroup::"
          done

  build:
    name: xcodegen + xcodebuild (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        id: select_xcode
        uses: ./.github/actions/select-xcode

      - name: Install XcodeGen
        id: xcodegen
        run: |
          set -euo pipefail
          brew install xcodegen
          # XcodeGen のバージョンが変わると生成される xcodeproj が変わりうるため、
          # DerivedData キャッシュキーへ含める（旧生成形式由来のキャッシュ復元を防ぐ）。
          echo "version=$(xcodegen version | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ steps.select_xcode.outputs.xcode_id }}-${{ steps.xcodegen.outputs.version }}-${{ hashFiles('project.yml', 'App/**', 'packages/**') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ steps.select_xcode.outputs.xcode_id }}-${{ steps.xcodegen.outputs.version }}-

      - name: xcodegen generate
        run: xcodegen generate

      - name: xcodebuild (iOS Simulator, unsigned)
        run: |
          xcodebuild build \
            -project KaoKakushi.xcodeproj \
            -scheme KaoKakushi \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
