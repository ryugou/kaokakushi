name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (strict)
        run: swiftlint lint --strict

  package-tests:
    name: swift test (全パッケージ)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version

      # このIssue（#4）では外部SwiftPM依存を一切追加していないため、
      # パッケージごとの .build キャッシュは導入しない。Package.resolved が
      # 存在しない状態でキャッシュキーを組むと常に固定キーになり「一度も
      # 更新されないキャッシュ」を生む事故につながる。外部依存が入る後続Issueで
      # Package.resolved を基にキャッシュキーを再設計して導入する。
      - name: swift test (all packages)
        run: |
          set -euo pipefail
          for p in Domain Rendering MediaKit Persistence Application Billing Ads Analytics; do
            echo "::group::swift test $p"
            swift test --package-path "packages/$p"
            echo "::endgroup::"
          done

  build:
    name: xcodegen + xcodebuild (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    needs:
      - swiftlint
      - package-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('project.yml', 'App/**', 'packages/**') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      - name: xcodegen generate
        run: xcodegen generate

      - name: xcodebuild (iOS Simulator, unsigned)
        run: |
          xcodebuild build \
            -project KaoKakushi.xcodeproj \
            -scheme KaoKakushi \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
